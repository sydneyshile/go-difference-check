name: Go CI

on:
  push:
    branches:
      - main
      - test

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.21.6'

      - name: Run Go tests
        run: |
          go test -v ./...

      - name: Build Go binary
        run: |
          go build -o main .

      - name: Run Go linter
        run: |
          go vet ./...

      - name: Run Go formatter
        run: |
           gofmt -d $(go list -f '{{.Dir}}' ./...)