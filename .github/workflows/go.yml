name: Go CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: '1.18'

      - name: Run Go tests
        run: |
          go test -v ./...

      - name: Build Go binary
        run: |
          go build -o main .

      - name: Run Go linter
        run: |
          go vet ./...

      - name: Run Go formatter
        run: |
          gofmt -d ./...