name: Go CI

on:
  push:
    branches:
      - main
      - test

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.21.6'

      - name: Build and test
        run: |
          go mod tidy
          go build -v .
          go test -v .

      - name: Code quality check
        run: |
          go vet .
          gofmt -s -w .
          golint .

      - name: Upload test results
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: test-results.txt